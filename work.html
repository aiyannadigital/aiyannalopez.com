<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>aiyanna's work</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="imgs/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="imgs/favicon-16.png">

  <!-- Your global site styles (keep your existing styles.css) -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Finder work page styles -->
  <link rel="stylesheet" href="work.css" />

  <!-- Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="page-work">

  <!-- Cursor + spotlight (kept) -->
  <div class="cursor">
    <div class="cursor-dot"></div>
  </div>
  <div class="spotlight"></div>

  <!-- Stars (kept) -->
  <canvas id="workSky" aria-hidden="true"></canvas>

  <!-- Header (kept) -->
  <header class="site-header">
    <nav class="nav">
      <div class="nav-left">
        <a class="nav-link underline" href="about.html">about</a>
        <a class="nav-link underline is-active" href="work.html">work</a>
        <a class="nav-link underline" href="proj-index.html">index</a>
        <button class="theme-toggle underline" type="button" id="themeToggle" aria-label="Toggle dark mode"
          aria-pressed="false">
          ☾
        </button>
      </div>

      <div class="nav-center">
        <a class="brand" href="index.html">aiyanna lopez</a>
      </div>

      <div class="nav-right">
        <a class="icon-link underline" href="https://youtube.com" target="_blank" rel="noreferrer"><i data-lucide="youtube"></i></a>
        <a class="icon-link underline" href="https://instagram.com" target="_blank" rel="noreferrer"><i data-lucide="instagram"></i></a>
        <a class="icon-link underline" href="https://substack.com" target="_blank" rel="noreferrer"><i data-lucide="newspaper"></i></a>
        <a class="icon-link underline" href="https://tumblr.com" target="_blank" rel="noreferrer"><i data-lucide="message-circle"></i></a>
      </div>
    </nav>
  </header>

  <main class="work-wrap">
    <!-- Finder window -->
    <section class="finder-shell" aria-label="Work Finder">
      <div class="finder-window" role="application" aria-label="Finder window">
        <!-- Toolbar -->
        <div class="finder-toolbar">
          <div class="traffic">
            <button class="tl tl-close" type="button" aria-label="Close window (does nothing)"></button>
            <button class="tl tl-min" type="button" aria-label="Minimize window (does nothing)"></button>
            <button class="tl tl-max" type="button" aria-label="Zoom window (does nothing)"></button>
          </div>

          <div class="finder-title">
            <span class="finder-title-main">work</span>
            <span class="finder-title-sub" id="finderBreadcrumb">/ Brand + Commerce</span>
          </div>

          <div class="finder-toolbar-right" aria-hidden="true">
            <!-- <i data-lucide="search"></i> -->
          </div>
        </div>

        <!-- Content -->
        <div class="finder-content">
          <!-- Sidebar -->
          <aside class="finder-sidebar" aria-label="Categories">
            <div class="sidebar-group">
              <div class="sidebar-group-label">categories</div>
              <nav class="sidebar-list" id="categoryList"></nav>
            </div>
          </aside>

          <!-- Main pane -->
          <section class="finder-main" aria-label="Projects">
            <div class="finder-main-header">
              <div class="finder-main-title" id="paneTitle">Brand + Commerce</div>
              <div class="finder-main-hint">double-click a folder to open</div>
            </div>

            <div class="folders-grid" id="foldersGrid" role="list"></div>

            <div class="empty-state" id="emptyState" hidden>
              <!-- <div class="empty-title">nothing here yet</div>
              <div class="empty-sub">add projects to this category whenever you want.</div> -->
            </div>
          </section>
        </div>
      </div>
    </section>
  </main>

  <!-- Project modal -->
  <div class="ios-modal" id="projectModal" aria-hidden="true">
    <div class="ios-modal-backdrop" data-close></div>

    <div class="ios-modal-card" role="dialog" aria-modal="true" aria-label="Project details">
      <div class="ios-modal-topbar">
        <div class="traffic">
          <button class="tl tl-close" type="button" data-close aria-label="Close"></button>
          <button class="tl tl-min" type="button" aria-label="Minimize (visual only)" disabled></button>
          <button class="tl tl-max" type="button" aria-label="Zoom (visual only)" disabled></button>
        </div>

        <div class="ios-modal-title">
          <span id="modalTitle">Project</span>
          <span id="modalMeta" class="ios-modal-meta">Meta</span>
        </div>

        <button class="ios-x underline" type="button" data-close aria-label="Close">close</button>
      </div>

      <div class="ios-modal-body">
        <div class="ios-media" id="modalMedia"></div>

        <div class="ios-text">
          <p id="modalDesc" class="ios-desc"></p>
          <div class="ios-links" id="modalLinks"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Your scripts -->
  <script src="work.js"></script>
  <script src="script.js"></script>
</body>

</html>
