<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>aiyanna's work</title>

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="work.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="page-work">

  <div class="cursor">
    <div class="cursor-dot"></div>
  </div>
  <div class="spotlight"></div>

  <canvas id="workSky" aria-hidden="true"></canvas>

  <header class="site-header">
    <nav class="nav">
      <div class="nav-left">
        <a class="nav-link underline" href="about.html">about</a>
        <a class="nav-link underline is-active" href="work.html">work</a>
        <a class="nav-link underline" href="proj-index.html">index</a>
        <button
          class="theme-toggle underline"
          type="button"
          id="themeToggle"
          aria-label="Toggle dark mode"
          aria-pressed="false"
        >
          ☾
        </button>
      </div>

      <div class="nav-center">
        <a class="brand" href="index.html">aiyanna lopez</a>
      </div>

      <div class="nav-right">
        <a class="icon-link underline" href="https://youtube.com" target="_blank" rel="noreferrer"><i data-lucide="youtube"></i></a>
        <a class="icon-link underline" href="https://instagram.com" target="_blank" rel="noreferrer"><i data-lucide="instagram"></i></a>
        <a class="icon-link underline" href="https://substack.com" target="_blank" rel="noreferrer"><i data-lucide="newspaper"></i></a>
        <a class="icon-link underline" href="https://tumblr.com" target="_blank" rel="noreferrer"><i data-lucide="message-circle"></i></a>
      </div>
    </nav>
  </header>

  <main class="work-page-shell">
    <section class="archive-shell" aria-label="Selected work">
      <!-- <div class="archive-browser-bar"> -->
        <!-- <div class="browser-icons">
          <span></span>
          <span></span>
          <span></span>
        </div> -->
        <!-- <div class="browser-strip"></div>
      </div> -->

      <div class="archive-topbar">
        <nav class="archive-nav" id="categoryList" aria-label="Categories"></nav>
      </div>

      <div class="archive-subnav">
        <button class="archive-subnav-button" type="button" aria-disabled="true">On View</button>
      </div>

        <div class="projects-carousel-shell">
  <button class="projects-arrow projects-arrow-left" id="projectsArrowLeft" type="button" aria-label="Scroll left">←</button>
  <button class="projects-arrow projects-arrow-right" id="projectsArrowRight" type="button" aria-label="Scroll right">→</button>

  <section class="projects-grid" id="projectsGrid" aria-label="Projects"></section>
</div>

      <!-- <section class="projects-grid" id="projectsGrid" aria-label="Projects"></section> -->
    </section>
  </main>

  <div class="project-modal" id="projectModal" aria-hidden="true">
    <div class="project-modal-backdrop" data-close></div>

    <div class="project-modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="project-modal-topbar">
        <button class="project-modal-close" type="button" data-close aria-label="Close">×</button>
      </div>

      <div class="project-modal-body">
        <div class="project-pairing" id="modalLayout">
          <div class="project-visual-panel">
            <div class="project-hero-wrap" id="modalImageWrap"></div>
            <div class="project-video-overlay" id="modalVideoWrap"></div>
          </div>

          <aside class="project-copy-panel">
            <div class="project-copy-block">
              <div class="project-popup-title" id="modalTitle">Project</div>
              <div class="project-popup-meta" id="modalMeta"></div>
              <p class="project-popup-desc" id="modalDesc"></p>
              <div class="project-popup-links" id="modalLinks"></div>
            </div>
          </aside>
        </div>
      </div>
    </div>
  </div>

  <script src="work.js"></script>
  <script src="script.js"></script>
</body>
</html>
